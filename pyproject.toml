[project]
name = "i2c"
version = "0.1.0"
description = "Fakturama Image-to-Cash automation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pywinauto>=0.6.9",
    "pillow>=10",
    "rapidocr_onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
i2c = "i2c.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
